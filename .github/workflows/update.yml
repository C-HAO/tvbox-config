name: Auto Update TVBox Configs

# 注意：GitHub Actions 的 on 字段需加引号，避免被部分 YAML 解析器当作布尔值
"on":
  # 定时触发：每天 02:00 和 14:00（UTC）自动更新
  schedule:
    - cron: "0 2,14 * * *"
  # 支持在 GitHub Actions 页面手动触发
  workflow_dispatch:
  # 修改配置或脚本后 push 时触发（仅监听 config/scripts，避免自动提交 output/ 引发死循环）
  push:
    branches:
      - develop
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "requirements.txt"

# 赋予 GITHUB_TOKEN 写仓库权限，并把聚合结果发布到 GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-update
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        env:
          # 健康检测：只生成有效源（默认开启，可按需调整）
          CHECK_SITES: "1"
          CHECK_LIVES: "1"
          # ALLOW_STALE_SOURCES: "1"   # 取消注释可恢复“失败沿用旧缓存”
        run: python scripts/update.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::没有内容变化，跳过提交"
          else
            git commit -m "chore: 自动更新影视仓配置 $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin HEAD:${{ github.ref_name }}
            echo "::notice::配置已更新并推送到 ${{ github.ref_name }} 分支"
          fi

      # 构建并上传 GitHub Pages 站点（浏览 / 分发 output/*.json）
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Pages site
        run: |
          python scripts/build_pages.py \
            --destination pages-site \
            --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy-pages:
    needs: [update]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
